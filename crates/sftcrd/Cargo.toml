[package]
name = "sftcrd"
version = "0.1.0"
edition = "2024"
description = "Smartcard server for PIV applet via VSmartCard protocol."

[dependencies]
sftcrd-piv = { path = "../sftcrd-piv" }
sftcrd-tlv = { path = "../sftcrd-tlv" }
apdu-dispatch = "0.4"
hex = "0.4"
iso7816 = "0.2"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
clap = { version = "4", features = ["derive"] }

[dev-dependencies]
keyroost-piv = "0.15.0"

[lints.clippy]
pedantic = "warn"
